name : <workflow-name>

on:
  push:
    branches: 
      - main
      - devel
  pull_request:
    branches: main 


jobs:
  sphinx - build :
    runs - on : ubuntu -22.04
    permissions :
      contents : write
      pages : write
      id-token : write
  steps :
    - name : Checkout code
      uses : actions / checkout@v4
    - name : Set up Python
      uses : actions / setup - python@v4
      with :
        python - version : ’3.10 ’
    - name : Build docs
      run : make doc
    - name : Upload GitHub Pages artifact
      uses : actions / upload - pages - artifact@v3
  .0.1
    with :
      path : html
      retention - days : 90
